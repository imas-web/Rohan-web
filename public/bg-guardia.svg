<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice">
  <defs>
    <radialGradient id="sky" cx="50%" cy="18%" r="75%">
      <stop offset="0%" stop-color="#2A2115"/>
      <stop offset="45%" stop-color="#171C12"/>
      <stop offset="100%" stop-color="#0B0C10"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#D9673F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#D9673F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A3420"/>
      <stop offset="100%" stop-color="#0B0C10"/>
    </linearGradient>
    <radialGradient id="fire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D9673F" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D9673F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0C10" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0B0C10" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1180" cy="150" r="70" fill="#C9A227" opacity="0.18"/>
  <ellipse cx="800" cy="330" rx="520" ry="260" fill="url(#glow)"/>

  <!-- Dragon silhouette, wings spread, arching over the scene -->
  <g fill="#05060A" opacity="0.92">
    <path d="M800 470
      C 700 380, 640 250, 560 190
      C 460 115, 300 90, 150 130
      C 260 150, 360 190, 430 250
      C 340 235, 230 235, 120 270
      C 240 275, 350 310, 420 360
      C 500 400, 560 430, 610 460
      C 560 470, 500 495, 470 530
      C 540 510, 610 505, 670 515
      C 640 545, 630 580, 640 615
      C 665 570, 700 540, 740 525
      C 760 545, 775 575, 780 610
      C 795 570, 815 540, 840 525
      C 865 540, 885 565, 895 600
      C 900 565, 915 535, 940 515
      C 990 505, 1040 510, 1085 530
      C 1055 495, 1000 470, 950 460
      C 1010 425, 1080 395, 1160 375
      C 1230 320, 1345 280, 1470 265
      C 1360 235, 1240 240, 1140 270
      C 1210 210, 1310 170, 1430 150
      C 1290 115, 1130 130, 1010 195
      C 930 240, 870 320, 830 400
      C 820 425, 810 450, 800 470 Z"/>
    <!-- tail -->
    <path d="M900 610 C 970 640, 1030 690, 1060 750 C 1075 780, 1080 810, 1075 835
      C 1055 800, 1030 760, 995 725 C 960 690, 925 655, 900 610 Z"/>
  </g>
  <!-- glowing eye + subtle ember breath -->
  <circle cx="565" cy="205" r="6" fill="#D9673F"/>
  <ellipse cx="430" cy="245" rx="90" ry="22" fill="#D9673F" opacity="0.25"/>

  <!-- ground -->
  <rect x="0" y="740" width="1600" height="260" fill="url(#ground)"/>
  <path d="M0 750 C 250 725, 450 770, 700 745 C 950 722, 1150 760, 1600 740 L1600 1000 L0 1000 Z" fill="#1B2318"/>

  <!-- campfire glow behind the warriors -->
  <ellipse cx="770" cy="770" rx="420" ry="120" fill="url(#fire)"/>

  <!-- 4 warriors, evenly spaced, heroic silhouettes rim-lit by the campfire -->
  <g fill="#05060A" stroke="#E8A85C" stroke-width="1.5" stroke-opacity="0.55" stroke-linejoin="round">
    <!-- warrior 1: sword raised -->
    <g transform="translate(430,660)">
      <circle cx="0" cy="0" r="22"/>
      <path d="M-18 22 C -24 95, -20 155, -16 215 L16 215 C 20 155, 24 95, 18 22 Z"/>
      <path d="M-18 42 L-58 92 L-48 103 L-11 64 Z"/>
      <path d="M18 42 L37 -14 L50 -5 L28 58 Z"/>
      <rect x="33" y="-76" width="9" height="96" transform="rotate(18 37 -28)"/>
    </g>
    <!-- warrior 2: shield + spear -->
    <g transform="translate(660,675)">
      <circle cx="0" cy="0" r="21"/>
      <path d="M-17 21 C -22 90, -18 150, -15 205 L15 205 C 19 150, 22 90, 17 21 Z"/>
      <ellipse cx="-44" cy="58" rx="18" ry="28"/>
      <rect x="26" y="-100" width="7" height="155"/>
    </g>
    <!-- warrior 3: axe -->
    <g transform="translate(880,675)">
      <circle cx="0" cy="0" r="21"/>
      <path d="M-17 21 C -22 90, -18 150, -15 205 L15 205 C 19 150, 22 90, 17 21 Z"/>
      <rect x="-44" y="-64" width="8" height="128" transform="rotate(-8 -40 0)"/>
      <path d="M-60 -66 C -82 -77, -86 -44, -66 -33 C -55 -39, -50 -53, -60 -66 Z"/>
      <path d="M18 42 L50 68 L41 80 L11 58 Z"/>
    </g>
    <!-- warrior 4: bow -->
    <g transform="translate(1100,660)">
      <circle cx="0" cy="0" r="22"/>
      <path d="M-18 22 C -24 95, -20 155, -16 215 L16 215 C 20 155, 24 95, 18 22 Z"/>
      <path d="M35 -44 C 60 -11, 60 65, 35 102" fill="none" stroke-width="4"/>
      <line x1="35" y1="-44" x2="35" y2="102" stroke-width="2"/>
    </g>
  </g>

  <rect x="0" y="820" width="1600" height="180" fill="url(#bottomFade)"/>
</svg>
